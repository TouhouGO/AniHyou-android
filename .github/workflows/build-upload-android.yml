name: Release AniHyou FOSS APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching version.properties (for example v1.6.2)
        required: true
        default: v1.6.2
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(sed -n 's/^name *= *//p' version.properties)
          EXPECTED_TAG="v${VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match version.properties ($EXPECTED_TAG)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [[ -z "$KEYSTORE_FILE_B64" ]]; then
            echo "KEYSTORE_FILE secret is not configured." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > "$RUNNER_TEMP/anihyou_release.keystore"
          chmod 600 "$RUNNER_TEMP/anihyou_release.keystore"

      - name: Build signed FOSS release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/anihyou_release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane android release

      - name: Verify release outputs
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/foss/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$apk"
            sha256sum "$apk"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: anihyou-${{ steps.version.outputs.version }}-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Replacing the previous TouhouGO release only after the new APKs passed verification."
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi

          args=(
            "$RELEASE_TAG"
            --target "$GITHUB_SHA"
            --title "AniHyou 中文增强版 v${VERSION}"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}" app/build/outputs/apk/foss/release/*.apk
