name: Publish FOSS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in version.properties (for example 1.8.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        default: false
        type: boolean
      source_commit:
        description: 'Optional full commit SHA for rebuilding an existing release'
        default: ''
        type: string
      artifacts_only:
        description: 'Build and sign downloadable Actions artifacts without changing a Release'
        default: false
        type: boolean

permissions: {}
concurrency:
  group: foss-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'TouhouGO/AniHyou-android' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
      - name: Select exact source revision
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['SOURCE_COMMIT'] or os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', value):
              raise SystemExit('Source commit must be a full SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + value + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Validate version and signing configuration
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 pipeline/scripts/release/release_foss.py validate --version "$RELEASE_VERSION" --head "$SOURCE_SHA" --source-root "$GITHUB_WORKSPACE/source"
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo '::error::Missing release signing configuration'
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified Gradle distribution
        run: |
          python3 pipeline/scripts/ci/prepare_gradle.py
          python3 pipeline/scripts/ci/prepare_kotlin_compiler.py
      - name: Inspect task graph and assemble unsigned APKs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 pipeline/scripts/release/release_foss.py build --version "$RELEASE_VERSION" --head "$SOURCE_SHA" --source-root "$GITHUB_WORKSPACE/source"
      - name: Sign and verify APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/release-keystore.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          unset KEYSTORE_B64
          python3 pipeline/scripts/release/release_foss.py sign --input-dir source/app/build/outputs/apk/foss/release --output-dir "$RUNNER_TEMP/release-artifacts" --keystore "$keystore" --source-root "$GITHUB_WORKSPACE/source"
      - name: Preserve signed Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foss-release-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Record build provenance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'Source commit: `%s`\n\nWorkflow commit: `%s`\n\nSigned artifacts verified before upload.\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified draft
        if: inputs.artifacts_only == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          args=(--artifacts "$RUNNER_TEMP/release-artifacts" --head "$SOURCE_SHA" --version "$RELEASE_VERSION" --source-root "$GITHUB_WORKSPACE/source")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          python3 pipeline/scripts/release/release_foss.py publish "${args[@]}"
