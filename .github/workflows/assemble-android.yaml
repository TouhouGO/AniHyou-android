name: Assemble android app

on:
  push:
    branches:
      - master
      - feat/*
      - fix/*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble FOSS debug
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anihyou-zh-cn-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
