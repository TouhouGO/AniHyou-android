name: Sync titles from upstream

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-titles-from-upstream
  cancel-in-progress: false

jobs:
  sync-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Sync titles
        run: bash scripts/sync-titles.sh

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain core/network/src/main/resources/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/network/src/main/resources/titles_zh_cn.json
          git commit -m "chore(data): auto-sync titles from anilist-zh-cn-userscript [skip ci]"
          git push origin HEAD:master
