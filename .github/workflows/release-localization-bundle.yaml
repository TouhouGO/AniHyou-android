name: Release Localization Bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2026.09.09)'
        required: true
        default: 'v2026.09.09'
      publish_release:
        description: 'Publish release immediately (uncheck to leave as draft)'
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'

permissions:
  contents: write

concurrency:
  group: localization-bundle-release
  cancel-in-progress: false

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check repository hygiene
        run: bash scripts/check-repository-hygiene.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/verify_localization_release.sh

      - name: Determine and Validate Release Tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # Strict version format check: ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "ERROR: Invalid release tag '$TAG'. Must match ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Run Localization Unit Tests
        run: |
          ./gradlew :core:network:test --tests '*Localization*' --tests '*Bangumi*'

      - name: Calibrate Titles with Latest Bangumi Archive
        run: |
          ./scripts/enrich_bundle_from_bangumi_archive.sh

      - name: Package Localization Bundle & Generate Remote Manifest
        env:
          TAG: ${{ steps.determine_tag.outputs.tag }}
        run: |
          # Derive deterministic build timestamp from the commit timestamp
          COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
          BUILD_TIMESTAMP=$((COMMIT_TIMESTAMP * 1000))

          ./gradlew :core:network:generateRemoteBundleManifest \
            -PbundleReleaseTag="$TAG" \
            -PbundleBuildTimestamp="$BUILD_TIMESTAMP"

      - name: Verify Generated Release Artifacts
        run: |
          ./scripts/verify_localization_release.sh \
            core/network/build/outputs/localization/localization_bundle.zip \
            core/network/build/outputs/localization/remote_bundle_manifest.json

      - name: Draft-First Ordered Release Publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.determine_tag.outputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        run: |
          ZIP_FILE="core/network/build/outputs/localization/localization_bundle.zip"
          MANIFEST_FILE="core/network/build/outputs/localization/remote_bundle_manifest.json"
          POINTER_TAG="localization-latest"

          # 1. Check if release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "ERROR: Release $TAG is already published! Non-destructive policy forbids overwriting published release assets. Please bump the version tag."
              exit 1
            fi
            echo "Found existing draft release for $TAG."
          else
            echo "Creating initial draft release for $TAG..."
            gh release create "$TAG" \
              --title "Localization Bundle $TAG" \
              --notes "Automated OTA localization bundle release with SHA-256 and remote bundle manifest." \
              --draft
          fi

          # 2. Upload ZIP file first
          echo "Uploading $ZIP_FILE..."
          gh release upload "$TAG" "$ZIP_FILE" --clobber

          # 3. Download ZIP back to verify remote integrity
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          echo "Downloading uploaded ZIP for remote integrity verification..."
          gh release download "$TAG" -p "localization_bundle.zip" -D "$VERIFY_DIR"

          LOCAL_SHA=$(shasum -a 256 "$ZIP_FILE" | awk '{print $1}')
          REMOTE_SHA=$(shasum -a 256 "$VERIFY_DIR/localization_bundle.zip" | awk '{print $1}')

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: Uploaded ZIP integrity check failed! Local SHA: $LOCAL_SHA, Remote SHA: $REMOTE_SHA"
            exit 1
          fi
          echo "Remote ZIP integrity confirmed."

          # 4. Upload manifest last only after ZIP is verified
          echo "Uploading $MANIFEST_FILE..."
          gh release upload "$TAG" "$MANIFEST_FILE" --clobber

          # 5. Publish draft if requested
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing release $TAG..."
            gh release edit "$TAG" --draft=false
            if ! gh release view "$POINTER_TAG" > /dev/null 2>&1; then
              gh release create "$POINTER_TAG" \
                --title "Latest Localization Bundle" \
                --notes "Stable manifest pointer for the latest verified localization bundle." \
                --latest=false
            fi
            gh release upload "$POINTER_TAG" "$MANIFEST_FILE" --clobber
            gh release edit "$POINTER_TAG" --latest=false
            echo "Release $TAG published successfully."
          else
            echo "Release $TAG left in draft state."
          fi

      - name: Backfill Built-in Baseline from Published Bundle
        if: ${{ github.event_name == 'push' || inputs.publish_release == 'true' }}
        env:
          TAG: ${{ steps.determine_tag.outputs.tag }}
        run: |
          set -euo pipefail
          BACKFILL_DIR=$(mktemp -d)
          trap 'rm -rf "${BACKFILL_DIR}"' EXIT

          # 1. 切到最新 master 分支并配置 Git
          #    不用 cherry-pick：tag 的旧基线与已前进的 master 做三方合并会冲突，
          #    而回填只触碰 5 个资源文件，直接在最新 master 上重做拷贝最可靠。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master

          # 2. 解包本地构建产物（已与远端通过 SHA-256 校验一致）并回填 5 个资源文件
          unzip -q core/network/build/outputs/localization/localization_bundle.zip \
            -d "${BACKFILL_DIR}"
          for f in bundle_manifest.json titles_zh_cn.json tags_zh_cn.json \
                   staff_characters_zh_cn.json t2s_char_map.json; do
            cp "${BACKFILL_DIR}/${f}" core/network/src/main/resources/${f}
          done

          # 3. 校验回填后内置清单与实际文件严格一致（size + sha256/md5 + 完整性）
          python3 - <<'PYEOF'
          import json, hashlib, sys, os
          res = "core/network/src/main/resources"
          m = json.load(open(os.path.join(res, "bundle_manifest.json")))
          assert m.get("formatVersion") == 1, "bad formatVersion"
          ok = True
          for name, entry in m["files"].items():
              p = os.path.join(res, name)
              if not os.path.exists(p):
                  print(f"MISSING: {name}"); ok = False; continue
              data = open(p, "rb").read()
              if len(data) != entry["size"]:
                  print(f"SIZE MISMATCH {name}: {len(data)} != {entry['size']}"); ok = False
              algo = "sha256" if "sha256" in entry else ("md5" if "md5" in entry else None)
              if algo is None:
                  print(f"NO CHECKSUM: {name}"); ok = False; continue
              actual = hashlib.new(algo, data).hexdigest()
              if actual.lower() != entry[algo].lower():
                  print(f"{algo.upper()} MISMATCH {name}: {actual} != {entry[algo]}"); ok = False
          # 注意：bundle_manifest.json 按设计不在 m["files"] 中（清单不声明自身），
          # 必须显式加入 declared，否则 present - declared 恒为非空导致误报。
          declared = set(m["files"]) | {"bundle_manifest.json"}
          present = {f for f in os.listdir(res) if f.endswith(".json")}
          extra = present - declared
          if extra:
              print(f"UNDECLARED JSON FILES: {sorted(extra)}"); ok = False
          sys.exit(0 if ok else 1)
          PYEOF

          # 4. 提交；无变化则正常跳过
          git add core/network/src/main/resources/
          if git diff --cached --quiet; then
            echo "Built-in baseline already matches published bundle; nothing to backfill."
            exit 0
          fi
          # [skip ci] 用于避免每次 OTA 发布都空跑一次 debug APK 构建；若希望新内置资源经过 APK 构建验证，可移除该标记。
          git commit -m "chore(data): backfill built-in baseline from localization bundle ${TAG} [skip ci]"

          # 5. 推送；若远端并发前进则 fetch + rebase 后重试一次（不用 force push）
          if ! git push origin HEAD:master; then
            echo "Push rejected; origin/master advanced during this run. Rebasing and retrying once."
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi



